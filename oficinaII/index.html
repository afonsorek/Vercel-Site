<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Oficina II</title>
  <meta name="description" content="Enquanto uns são aplaudidos no palco, outros são abafados pela platéia." />
  <meta name="author" content="Afonso Rekbaim" />
  <link rel="canonical" href="https://www.afonso.io/oficinaII/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="screen">

    <!-- Frase no topo -->
    <header class="top-quote-wrap">
      <p class="top-quote">
        “Enquanto uns são aplaudidos no palco, outros são abafados pela platéia.”
      </p>
    </header>

    <!-- Centro: Campos de texto -->
    <section class="center-stage">
      <form id="cocreationForm" class="clean-form" autocomplete="off" novalidate>

        <!-- Música (Input + Dropdown) -->
        <div class="field">
          <label for="songSearchInput" class="field-label">Música</label>

          <div class="search-combobox" id="searchCombobox">
            <input
              type="text"
              id="songSearchInput"
              class="clean-input"
              placeholder="Buscar no YouTube..."
              aria-autocomplete="list"
              aria-controls="searchResultsDropdown"
              aria-expanded="false"
            />
            <span id="searchSpinner" class="search-spinner" hidden aria-hidden="true"></span>

            <ul
              id="searchResultsDropdown"
              class="search-dropdown"
              role="listbox"
              hidden
            ></ul>
          </div>

          <div id="selectedSongCard" class="selected-song" hidden>
            <span id="selectedSongTitle" class="selected-song-title"></span>
            <button type="button" id="clearSongBtn" class="clear-song-btn" aria-label="Trocar música">×</button>
          </div>
        </div>

        <!-- Nome -->
        <div class="field">
          <label for="participantName" class="field-label">Nome</label>
          <input
            type="text"
            id="participantName"
            class="clean-input"
            maxlength="80"
            required
          />
        </div>

        <!-- O que essa música significa para você? -->
        <div class="field">
          <label for="songMeaning" class="field-label">O que essa música significa para você?</label>
          <textarea
            id="songMeaning"
            class="clean-input clean-textarea"
            rows="2"
            maxlength="320"
            required
          ></textarea>
        </div>

        <p id="formError" class="form-error" role="alert" hidden></p>

        <button type="submit" id="submitBtn" class="submit-btn">Enviar</button>
      </form>

      <!-- Ranking do histórico (máximo 3 visíveis; #1 toca em looping) -->
      <ol id="rankingList" class="ranking-list" aria-live="polite"></ol>
    </section>

  </main>

  <!-- Botão ultra discreto no canto para baixar o JSON salvo no final -->
  <button
    type="button"
    id="downloadJsonBtn"
    class="corner-json-btn"
    title="Baixar JSON com todas as entradas"
  >
    json (<span id="downloadCountBadge">0</span>)
  </button>

  <!-- Player de áudio oculto (apenas som em looping, sem mostrar vídeo) -->
  <div class="hidden-audio-engine" aria-hidden="true">
    <div id="ytPlayerContainer"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>

</html>
